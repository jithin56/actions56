name: test
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Deploy to production
              run: npm run build
            - name: Notify deployment
              run: echo "Deployment completed successfully!"